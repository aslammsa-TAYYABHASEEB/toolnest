<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ToolNest final production colour comparison</title>
  <desc id="desc">Approved M1-A logo in light and dark headers, favicon sizes, horizontal lockups, and final colour swatches.</desc>
  <defs>
    <g id="symbol"><path d="M10 9h25v10h-9v36H16V19h-6V9Zm23 10h8l7 15V19h8v36h-8l-7-15v15h-8V19Z"/></g>
    <g id="tool"><path d="M2 12h32v8H22v32h-8V20H2z"/><path fill-rule="evenodd" d="M52 20a16 16 0 1 1 0 32 16 16 0 0 1 0-32Zm0 7a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path fill-rule="evenodd" d="M85 20a16 16 0 1 1 0 32 16 16 0 0 1 0-32Zm0 7a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="M104 10h8v31c0 3 1.5 4 4 4h3v7h-5c-7 0-10-3.5-10-10V10Z"/></g>
    <g id="nest"><path d="M128 12h8l16 25V12h8v40h-8l-16-25v25h-8V12Z"/><path fill-rule="evenodd" d="M182 19c10 0 15 7 15 18v2h-23c1 4 4 7 9 7 4 0 7-1 10-3v7c-3 2-7 3-11 3-10 0-16-7-16-17 0-10 7-17 16-17Zm0 7c-4 0-7 3-8 7h15c-1-4-3-7-7-7Z"/><path d="M226 22v7c-4-2-8-3-12-3-3 0-5 1-5 3 0 2 2 2 7 3 8 1 12 4 12 10 0 7-6 11-15 11-5 0-10-1-14-4v-7c5 3 9 4 14 4 4 0 6-1 6-3 0-2-2-3-7-4-8-1-11-4-11-10 0-7 6-11 15-11 5 0 9 1 13 3Z"/><path d="M241 12h8v9h9v7h-9v13c0 3 1 4 4 4 2 0 3 0 5-1v7c-2 1-5 2-8 2-6 0-9-4-9-11V28h-6v-7h6v-9Z"/></g>
    <style>
      .label{font:700 18px Arial,sans-serif;fill:#0F172A}.small{font:14px Arial,sans-serif;fill:#64748B}.dark-label{font:700 18px Arial,sans-serif;fill:#FFFFFF}.dark-small{font:14px Arial,sans-serif;fill:#CBD5E1}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F8FAFC"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">ToolNest final production colours</text>
  <text x="72" y="104" class="small">Frozen M1-A geometry · frozen outlined wordmark · integration review</text>

  <text x="72" y="155" class="label">Light header</text>
  <rect x="72" y="175" width="1456" height="112" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g transform="translate(112 216) scale(.375)" fill="#5B4CF0"><use href="#symbol"/></g>
  <g transform="translate(145 216) scale(.375)"><g fill="#0F172A"><use href="#tool"/></g><g fill="#5B4CF0"><use href="#nest"/></g></g>
  <rect x="490" y="207" width="390" height="48" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="512" y="237" class="small">Search tools</text>
  <text x="1130" y="237" class="small">Home      Categories      Browse all +</text>

  <text x="72" y="337" class="label">Dark header</text>
  <rect x="72" y="357" width="1456" height="112" rx="16" fill="#0D111C" stroke="#303B50"/>
  <g transform="translate(112 398) scale(.375)" fill="#887CFF"><use href="#symbol"/></g>
  <g transform="translate(145 398) scale(.375)"><g fill="#FFFFFF"><use href="#tool"/></g><g fill="#887CFF"><use href="#nest"/></g></g>
  <rect x="490" y="389" width="390" height="48" rx="12" fill="#161C2A" stroke="#424F66"/>
  <text x="512" y="419" class="dark-small">Search tools</text>
  <text x="1130" y="419" class="dark-small">Home      Categories      Browse all +</text>

  <text x="72" y="529" class="label">Favicon geometry</text>
  <g transform="translate(72 554)">
    <rect width="120" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <g transform="translate(44 30) scale(.25)" fill="#5B4CF0"><use href="#symbol"/></g>
    <text x="43" y="102" class="small">16px</text>
  </g>
  <g transform="translate(212 554)">
    <rect width="120" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <g transform="translate(44 28) scale(.5)" fill="#5B4CF0"><use href="#symbol"/></g>
    <text x="43" y="102" class="small">32px</text>
  </g>
  <g transform="translate(352 554)">
    <rect width="120" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <g transform="translate(36 20) scale(.75)" fill="#5B4CF0"><use href="#symbol"/></g>
    <text x="43" y="102" class="small">48px</text>
  </g>

  <text x="540" y="529" class="label">Horizontal logo</text>
  <rect x="540" y="554" width="988" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g transform="translate(590 582)" fill="#5B4CF0"><use href="#symbol"/></g>
  <g transform="translate(670 582)"><g fill="#0F172A"><use href="#tool"/></g><g fill="#5B4CF0"><use href="#nest"/></g></g>
  <rect x="1030" y="554" width="498" height="120" rx="14" fill="#0D111C"/>
  <g transform="translate(1070 582)" fill="#887CFF"><use href="#symbol"/></g>
  <g transform="translate(1150 582)"><g fill="#FFFFFF"><use href="#tool"/></g><g fill="#887CFF"><use href="#nest"/></g></g>

  <text x="72" y="749" class="label">Final palette assignments</text>
  <rect x="72" y="776" width="430" height="142" rx="18" fill="#5B4CF0"/>
  <text x="100" y="838" class="dark-label">Canonical brand primary</text><text x="100" y="871" class="dark-small">#5B4CF0 · favicon and external assets</text>
  <rect x="526" y="776" width="430" height="142" rx="18" fill="#887CFF"/>
  <text x="554" y="838" class="dark-label">Dark-context accent</text><text x="554" y="871" class="dark-small">#887CFF · symbol and Nest in dark UI</text>
  <rect x="980" y="776" width="548" height="142" rx="18" fill="#0F172A"/>
  <text x="1008" y="838" class="dark-label">Ink and reversed text</text><text x="1008" y="871" class="dark-small">#0F172A light ink · #FFFFFF reversed Tool text</text>
  <text x="72" y="966" class="small">No UI token changes · no geometry changes · no runtime font or external asset dependency</text>
</svg>
